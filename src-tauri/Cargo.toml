[package]
name = "ruby-launcher"
version = "0.23.0"
description = "Ruby Launcher: controller-first launcher for Minecraft: Ruby Edition"
authors = ["QTech Studios"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ruby_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring-core = "=1.0.0"
futures-util = "0.3"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
