<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept C · Title Screen</title>
<link rel="stylesheet" href="./shared.css">
<style>
  .bg { position: absolute; inset: -40px; filter: blur(3px) saturate(1.1); transform: scale(1.04); }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(12,8,9,.45) 0%, rgba(12,8,9,.25) 40%, rgba(12,8,9,.8) 100%); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 110px; }
  .logo { display: flex; align-items: center; gap: 22px; }
  .logo img { width: 110px; height: 110px; filter: drop-shadow(0 10px 30px rgba(255,64,110,.45)); }
  .logo span { font-size: 120px; font-weight: 900; letter-spacing: -0.05em; text-shadow: 0 8px 40px rgba(0,0,0,.6); }

  .picker { margin-top: 44px; display: flex; align-items: center; gap: 26px; }
  .picker .arrow { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 30px; color: var(--muted); }
  .picker .card { width: 640px; height: 112px; border-radius: 26px; display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 22px; padding: 0 18px; background: rgba(20,13,16,.8); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px); text-align: left; }
  .picker .card .icon { width: 80px; height: 80px; border-radius: 18px; }
  .picker .card strong { display: block; font-size: 30px; }
  .picker .card small { display: block; font-size: 20px; color: var(--muted); margin-top: 4px; }
  .dots { display: flex; gap: 10px; margin-top: 18px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .dots i.on { background: var(--text); width: 28px; border-radius: 6px; }

  .menu { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; width: 640px; }
  .menu button { height: 86px; border-radius: 22px; font-size: 30px; font-weight: 700; background: rgba(20,13,16,.78); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px); }
  .menu button.play { height: 104px; font-size: 38px; border: 0; background: linear-gradient(180deg, var(--ruby-bright), var(--ruby)); }
  .menu .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .corner { position: absolute; left: 64px; bottom: 40px; display: flex; align-items: center; gap: 16px; font-size: 22px; color: var(--muted); }
  .corner strong { color: var(--text); display: block; font-size: 24px; }
  .version { position: absolute; left: 64px; top: 48px; font-size: 18px; color: var(--subtle); }
</style>
</head>
<body>
  <div class="bg cover" data-cover="4,meadow,128,72"></div>
  <div class="shade"></div>
  <div class="version">Ruby Launcher b2026.22</div>

  <main class="center">
    <div class="logo"><img src="./ruby-mark.svg" alt=""><span>RUBY</span></div>

    <div class="picker">
      <span class="arrow">LB</span>
      <button class="card focusable"><span class="icon cover" data-cover="4,meadow"></span><span><strong>Fabulously Optimized</strong><small>Fabric 1.21.4 · last played 2 hours ago</small></span></button>
      <span class="arrow">RB</span>
    </div>
    <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>

    <nav class="menu">
      <button class="play focusable" id="play">Play</button>
      <div class="pair"><button class="focusable">Instances</button><button class="focusable">Modpacks</button></div>
      <div class="pair"><button class="focusable">Settings</button><button class="focusable">Quit</button></div>
    </nav>
  </main>

  <div class="corner"><span class="avatar">S</span><span><strong>Steve_QTech</strong>Microsoft account</span></div>

<script type="module">
  import { paintCovers, enableNav, renderChrome } from "./shared.js";
  renderChrome(null, [["A", "Select"], ["LB", "Prev", "wide"], ["RB", "Next", "wide"], ["Y", "Profile options"]]);
  document.querySelector(".topbar").remove(); // this concept has no tab bar on purpose
  paintCovers();
  enableNav({ initial: "#play" });
</script>
</body>
</html>
