<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings redesign</title>
<link rel="stylesheet" href="./shared.css">
<style>
  body { background: radial-gradient(circle at 85% 0%, rgba(171,26,66,.22), transparent 900px), var(--bg); }
  .layout { position: absolute; inset: 132px 64px 112px 64px; display: grid; grid-template-columns: 420px 1fr; gap: 56px; }
  .cats { display: flex; flex-direction: column; gap: 8px; }
  .cat { height: 84px; padding: 0 28px; border-radius: 22px; font-size: 26px; font-weight: 600; text-align: left; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  .cat.current { color: var(--text); background: rgba(255,255,255,.06); }
  .cat.current::after { content: ""; width: 8px; height: 36px; border-radius: 4px; background: var(--ruby-bright); }
  .cat.is-focused { background: var(--text); color: #1a0e12; transform: none; }

  .panel h1 { font-size: 48px; font-weight: 800; letter-spacing: -0.03em; }
  .panel .sub { margin-top: 8px; font-size: 22px; color: var(--subtle); display: flex; align-items: center; gap: 10px; }
  .panel .sub .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .settings { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; }
  .set { display: grid; grid-template-columns: 1fr 460px; align-items: center; gap: 32px; min-height: 108px; padding: 18px 32px; border-radius: 24px; background: rgba(255,255,255,.035); text-align: left; }
  .set strong { display: block; font-size: 26px; font-weight: 700; }
  .set small { display: block; margin-top: 6px; font-size: 19px; color: var(--muted); }
  .set.is-focused { background: var(--surface-2); transform: none; box-shadow: inset 0 0 0 3px var(--ruby-bright), 0 16px 40px rgba(0,0,0,.35); }

  .cycler { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; font-size: 24px; font-weight: 700; text-align: center; }
  .cycler i { font-style: normal; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--muted); font-size: 26px; }
  .is-focused .cycler i { background: var(--ruby); color: white; }

  .slider { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 20px; }
  .slider .track { height: 14px; border-radius: 7px; background: rgba(255,255,255,.1); position: relative; }
  .slider .fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--ruby-bright); }
  .slider .fill::after { content: ""; position: absolute; right: -14px; top: -7px; width: 28px; height: 28px; border-radius: 50%; background: white; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .slider b { font-size: 24px; text-align: right; }

  .toggle { justify-self: end; width: 96px; height: 54px; border-radius: 27px; background: rgba(255,255,255,.14); position: relative; }
  .toggle::after { content: ""; position: absolute; left: 6px; top: 6px; width: 42px; height: 42px; border-radius: 50%; background: #d8cdd1; transition: 150ms; }
  .toggle.on { background: var(--ruby); }
  .toggle.on::after { left: 48px; background: white; }
</style>
</head>
<body>
  <div class="layout">
    <nav class="cats">
      <button class="cat focusable">Game defaults</button>
      <button class="cat current focusable">Controller</button>
      <button class="cat focusable">Launcher</button>
      <button class="cat focusable">Account</button>
      <button class="cat focusable">Diagnostics</button>
      <button class="cat focusable">About</button>
    </nav>

    <section class="panel">
      <h1>Controller</h1>
      <p class="sub"><span class="dot"></span>Xbox Wireless Controller · changes save automatically</p>
      <div class="settings">
        <button class="set focusable" id="first"><span><strong>In-game controller support</strong><small>Master switch. Each instance can still turn it off.</small></span><span class="toggle on"></span></button>
        <button class="set focusable"><span><strong>Stick deadzone</strong><small>Raise this if a worn stick drifts on its own.</small></span><span class="slider"><span class="track"><span class="fill" style="width:30%"></span></span><b>22%</b></span></button>
        <button class="set focusable"><span><strong>Movement style</strong><small>How the left stick maps to walking in-game.</small></span><span class="cycler"><i>‹</i>Classic<i>›</i></span></button>
        <button class="set focusable"><span><strong>Vibration</strong><small>Short pulses when moving focus and pressing buttons.</small></span><span class="toggle on"></span></button>
        <button class="set focusable"><span><strong>Button layout</strong><small>Swaps A/B glyphs and confirm/back.</small></span><span class="cycler"><i>‹</i>Xbox<i>›</i></span></button>
      </div>
    </section>
  </div>
<script type="module">
  import { enableNav, renderChrome } from "./shared.js";
  renderChrome("Settings", [["A", "Toggle"], ["✥", "Adjust", "dpad"], ["B", "Back"]]);
  enableNav({ initial: "#first" });
</script>
</body>
</html>
