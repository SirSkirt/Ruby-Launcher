name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Keep the public release as a draft for review
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the public release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ruby-windows-publish
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RELEASES_OWNER: ${{ vars.RUBY_RELEASES_OWNER }}
      RELEASES_REPO: ${{ vars.RUBY_RELEASES_REPO }}
      RELEASES_BRANCH: ${{ vars.RUBY_RELEASES_BRANCH }}
      RELEASES_TOKEN: ${{ secrets.RUBY_RELEASES_TOKEN }}

    steps:
      - name: Check release repository configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_OWNER)) {
            throw "Repository variable RUBY_RELEASES_OWNER is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_REPO)) {
            throw "Repository variable RUBY_RELEASES_REPO is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_TOKEN)) {
            throw "Repository secret RUBY_RELEASES_TOKEN is missing."
          }

      - name: Check out private source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java 21 for Ruby Modules
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java toolchain
        shell: pwsh
        run: |
          java -version
          javac -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend and Tauri dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify and prepare Ruby Launcher
        shell: pwsh
        run: npm run ci:prepare

      - name: Build and upload compiled release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RUBY_RELEASES_TOKEN }}
        with:
          owner: ${{ vars.RUBY_RELEASES_OWNER }}
          repo: ${{ vars.RUBY_RELEASES_REPO }}
          releaseCommitish: ${{ vars.RUBY_RELEASES_BRANCH || 'main' }}
          tagName: ruby-v__VERSION__
          releaseName: Ruby Launcher v__VERSION__
          releaseBody: |
            Ruby Launcher Windows release built from the private source repository by GitHub Actions.

            Only compiled installer assets are published here; the application source remains private.
          releaseDraft: ${{ inputs.draft_release }}
          prerelease: ${{ inputs.prerelease }}
          generateReleaseNotes: false
          uploadUpdaterJson: false
          args: --bundles nsis,msi
          releaseAssetNamePattern: Ruby-Launcher-v[version]-Windows-[arch][setup].[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Ruby-Launcher-v[version]-[platform]-[arch]-[bundle]
