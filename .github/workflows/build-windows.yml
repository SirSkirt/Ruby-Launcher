name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ruby-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # Microsoft sign-in application ID, compiled into the launcher (see microsoft_client_id in lib.rs).
      RUBY_SIGNIN_KEY: ${{ secrets.RUBY_SIGNIN_KEY }}

    steps:
      - name: Check out private source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java 21 for Ruby Modules
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java toolchain
        shell: pwsh
        run: |
          java -version
          javac -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend and Tauri dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Check the sign-in key secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUBY_SIGNIN_KEY)) {
            Write-Output "::warning::RUBY_SIGNIN_KEY secret is missing; this test build won't be able to sign in."
          }

      - name: Verify and prepare Ruby Launcher
        shell: pwsh
        run: npm run ci:prepare

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis,msi
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Ruby-Launcher-v[version]-[platform]-[arch]-[bundle]
